<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القرآن الكريم</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body {
      background: #0b1120;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 1;
      background: linear-gradient(160deg, rgba(6, 78, 59, 0.55), rgba(30, 41, 59, 0.88));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 85px;
      height: 85px;
      margin: 0 auto 0.85rem auto;
      display: block;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
    }
    h1 {
      font-size: 1.45rem;
      margin-bottom: 0.5rem;
      color: #34d399;
    }
    p {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem 1.2rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      background: #065f46;
      border: 1px solid #34d399;
      color: #ecfdf5;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .btn:hover {
      background: #047857;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="card">
    <!-- أيقونة المصحف الشريف بدون خلفية أو نص -->
    <svg class="logo" viewBox="0 0 120 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#134e4a"/>
          <stop offset="100%" stop-color="#064e3b"/>
        </linearGradient>
        <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e3a3a"/>
          <stop offset="100%" stop-color="#0f2926"/>
        </linearGradient>
        <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2c524d"/>
          <stop offset="100%" stop-color="#13332f"/>
        </linearGradient>
        <linearGradient id="coverGreen" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#15803d"/>
          <stop offset="100%" stop-color="#065f46"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fde047"/>
          <stop offset="50%" stop-color="#eab308"/>
          <stop offset="100%" stop-color="#ca8a04"/>
        </linearGradient>
        <linearGradient id="pagesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fef3c7"/>
          <stop offset="50%" stop-color="#fcd34d"/>
          <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
      </defs>

      <!-- العلبة السفلية للمصحف -->
      <!-- السطح العلوي للعلبة -->
      <polygon points="60,26 108,46 62,76 12,53" fill="url(#boxTop)" stroke="#042f2e" stroke-width="1"/>
      <!-- الجانب الأيسر للعلبة -->
      <polygon points="12,53 62,76 62,98 14,73" fill="url(#boxLeft)" stroke="#042f2e" stroke-width="1"/>
      <!-- خط غطاء العلبة الأيسر -->
      <line x1="12.5" y1="60" x2="62" y2="83" stroke="#34d399" stroke-width="0.7" opacity="0.4"/>
      <!-- الجانب الأيمن للعلبة -->
      <polygon points="62,76 108,46 105,68 62,98" fill="url(#boxRight)" stroke="#042f2e" stroke-width="1"/>
      <!-- خط غطاء العلبة الأيمن -->
      <line x1="62" y1="83" x2="107" y2="53" stroke="#34d399" stroke-width="0.7" opacity="0.4"/>

      <!-- المصحف الشريف فوق العلبة -->
      <!-- الصفحات الذهبية من الجانب الأيسر -->
      <polygon points="18,38 62,58 62,70 19,49" fill="url(#pagesGrad)"/>
      <!-- خطوط الصفحات -->
      <line x1="18.5" y1="42" x2="62" y2="62" stroke="#b45309" stroke-width="0.6" opacity="0.6"/>
      <line x1="18.8" y1="45.5" x2="62" y2="66" stroke="#b45309" stroke-width="0.6" opacity="0.6"/>

      <!-- كعب المصحف (الجانب الأيمن المستدير) -->
      <path d="M62,58 L102,33 C106,36 106,42 102,46 L62,70 Z" fill="#052e16" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <!-- زخارف ذهبية على كعب المصحف -->
      <line x1="72" y1="52" x2="72" y2="64" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <line x1="83" y1="45" x2="83" y2="57" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <line x1="93" y1="39" x2="93" y2="51" stroke="url(#goldGrad)" stroke-width="1.5"/>

      <!-- الغلاف العلوي للمصحف -->
      <polygon points="60,12 103,32 62,58 17,37" fill="url(#coverGreen)" stroke="url(#goldGrad)" stroke-width="2"/>
      
      <!-- الإطار الذهبي الداخلي للغلاف -->
      <polygon points="60,16 96,33 62,54 24,36" fill="none" stroke="url(#goldGrad)" stroke-width="1.3"/>
      
      <!-- الزخرفة الوسطى (السرة الذهبية) -->
      <polygon points="60,26 72,34.5 60,43 48,34.5" fill="url(#goldGrad)"/>
      <circle cx="60" cy="34.5" r="4.5" fill="#065f46" stroke="#fef08a" stroke-width="1"/>
      
      <!-- زوايا زخرفية ذهبية -->
      <circle cx="60" cy="20" r="1.5" fill="#fde047"/>
      <circle cx="61" cy="49" r="1.5" fill="#fde047"/>
      <circle cx="32" cy="36" r="1.5" fill="#fde047"/>
      <circle cx="88" cy="33" r="1.5" fill="#fde047"/>
    </svg>

    <h1>القرآن الكريم</h1>
    <p>اضغط على الزر بالأسفل للوصول إلى مكتبة الصوتيات.</p>

    <a class="btn" href="player.html">استمع إلى القرآن الكريم</a>
  </div>

  <script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      createParticles();
    }

    function createParticles() {
      const count = Math.min(45, Math.max(20, Math.floor((canvas.width * canvas.height) / 28000)));
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 1.1,
          vy: (Math.random() - 0.5) * 1.1,
          r: Math.random() * 2.5 + 1
        });
      }
    }

    window.addEventListener('resize', resize);
    resize();

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#34d399';
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.16)';

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
